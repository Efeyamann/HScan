name: Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/cache/restore@v4
        id: gradle-cache
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
      - name: Restore private signing key
        env:
          KEYSTORE: ${{ secrets.HSCAN_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE"
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/hscan.p12"
      - name: Check and build
        env:
          HSCAN_KEYSTORE_PATH: ${{ runner.temp }}/hscan.p12
          HSCAN_KEYSTORE_PASSWORD: ${{ secrets.HSCAN_KEYSTORE_PASSWORD }}
          HSCAN_VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest lintDebug assembleRelease assembleDebug assembleDebugAndroidTest --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HScan-APK
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 7
      - name: Upload test APKs
        uses: actions/upload-artifact@v4
        with:
          name: android-tests
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/androidTest/debug/*.apk
          retention-days: 2
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: check-reports
          path: |
            app/build/reports/
            app/build/test-results/
            app/schemas/
          retention-days: 7
      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/hscan.p12"
      - uses: actions/cache/save@v4
        if: always() && steps.gradle-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
  device-tests:
    runs-on: ubuntu-24.04
    needs: build
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: android-tests
          path: test-apks
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          script: |
            adb shell wm size 1080x1920
            adb shell wm density 480
            adb install $(find test-apks -name app-debug.apk)
            adb install $(find test-apks -name app-debug-androidTest.apk)
            adb shell am instrument -w -r com.efeyamann.hscan.test/androidx.test.runner.AndroidJUnitRunner | tee device-tests.txt
            adb pull /sdcard/Android/data/com.efeyamann.hscan/files/screenshots screenshots || true
            ! grep -E 'FAILURES|INSTRUMENTATION_FAILED|Process crashed' device-tests.txt
            grep -E 'OK \([0-9]+ tests?\)' device-tests.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-checks
          path: |
            device-tests.txt
            screenshots/
          retention-days: 7
  publish:
    needs: [build, device-tests]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: HScan-APK
          path: apk
      - name: Publish verified APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cp apk/app-release.apk HScan.apk
          TAG="build-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" HScan.apk --target "$GITHUB_SHA" --title "HScan 0.1 · build ${GITHUB_RUN_NUMBER}" --notes "Android 8 ve üzeri. Kişisel manga/manhwa okuyucusu. APK aynı imza ile güncellenir. Birim testleri, lint ve Android cihaz testleri geçti."
